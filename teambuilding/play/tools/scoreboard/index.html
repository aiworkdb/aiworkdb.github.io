<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T4 积分计分板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .hero { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d5e 100%); color: #fff; padding: 36px 20px 26px; text-align: center; }
  .hero h1 { font-size: 1.5em; margin-bottom: 8px; }
  .hero p { font-size: 0.92em; opacity: 0.85; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 100px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05em; margin-bottom: 8px; }
  .hint { font-size: 0.85em; color: #888; margin-bottom: 12px; }
  .btn { display: inline-block; padding: 10px 16px; border: none; border-radius: 8px; font-size: 0.92em; cursor: pointer; text-align: center; background: #5b8cfe; color: #fff; font-family: inherit; }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: #fff; color: #5b8cfe; border: 1px solid #5b8cfe; }
  .btn.gray { background: #e2e6ee; color: #666; }
  .btn.red { background: #e0563f; }
  .btn.primary { padding: 12px 22px; font-size: 1em; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .count-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .count-btn { flex: 1; min-width: 52px; padding: 10px 0; border-radius: 8px; border: 1px solid #d0d5e0; background: #fff; font-size: 1em; cursor: pointer; font-family: inherit; color: #1a1a2e; }
  .count-btn.active { background: #5b8cfe; border-color: #5b8cfe; color: #fff; font-weight: 700; }
  .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .name-row .idx { width: 34px; color: #999; font-size: 0.9em; }
  .name-row input { flex: 1; border: 1px solid #d0d5e0; border-radius: 8px; padding: 10px 12px; font-size: 0.92em; font-family: inherit; }
  .name-row input:focus { outline: none; border-color: #5b8cfe; }
  .leader { background: #eef2ff; border: 1px solid #c9d6ff; border-radius: 8px; padding: 10px 12px; font-size: 0.92em; text-align: center; margin-bottom: 14px; font-weight: 600; }
  .team-card { border: 1px solid #e2e6ee; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff; }
  .team-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .team-name { font-size: 1.05em; font-weight: 700; }
  .score { font-size: 2.6em; font-weight: 700; font-variant-numeric: tabular-nums; color: #1a1a2e; line-height: 1; display: inline-block; }
  .score.bump { animation: bump 0.32s ease; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .score-btn { min-width: 48px; padding: 9px 0; border-radius: 8px; font-size: 0.95em; font-weight: 700; cursor: pointer; font-family: inherit; }
  .score-btn.add { background: #eef2ff; color: #3366cc; border: 1px solid #c9d6ff; }
  .score-btn.sub { background: #fdeeed; color: #c0392b; border: 1px solid #f5c6c0; }
  .score-btn:active { transform: scale(0.96); }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e2e6ee; padding: 12px 16px; text-align: center; }
  .footer a { color: #5b8cfe; font-size: 0.9em; text-decoration: none; margin: 0 12px; }
  @media (min-width: 560px) {
    #teamList { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .team-card { margin-bottom: 0; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>积分计分板</h1>
  <p>多队伍实时计分 · 大屏展示 · 手机可操作</p>
</div>

<div class="wrap">
  <div class="card" id="setupPanel">
    <h2>队伍设置</h2>
    <p class="hint">选择队伍数量（2-8），队名可修改</p>
    <div class="count-row" id="countRow"></div>
    <div id="nameList"></div>
    <div class="btn-row">
      <button type="button" class="btn primary" onclick="startGame()">开始计分</button>
    </div>
  </div>

  <div class="card" id="boardPanel" style="display:none">
    <h2>实时计分</h2>
    <div class="leader" id="leaderLine"></div>
    <div id="teamList"></div>
    <div class="btn-row">
      <button type="button" class="btn gray" onclick="resetScores()">重置分数</button>
      <button type="button" class="btn ghost" onclick="reSetup()">重新设置</button>
      <button type="button" class="btn red" onclick="clearSave()">清除存档</button>
    </div>
  </div>
</div>

<div class="footer">
  <a href="../../index.html">返回产品总览</a>
  <a href="https://ai.aitboy.cn/teambuilding/">团建游戏库</a>
</div>

<script>
var STORE_KEY = 'tb_scoreboard_v1';
var MIN_TEAMS = 2;
var MAX_TEAMS = 8;
var DEFAULT_NAMES = ['红队', '蓝队', '黄队', '绿队'];

var state = { count: 4, names: [], scores: [] };

// ---- localStorage 容错 ----
function lsGet(k, d) {
  try {
    var v = localStorage.getItem(k);
    return v ? JSON.parse(v) : d;
  } catch (e) { return d; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function defaultName(i) {
  return DEFAULT_NAMES[i] || ('队伍' + (i + 1));
}

function saveState() { lsSet(STORE_KEY, { count: state.count, names: state.names, scores: state.scores }); }

// ---- 配置面板 ----
function renderSetup() {
  var countHtml = '';
  for (var i = MIN_TEAMS; i <= MAX_TEAMS; i++) {
    countHtml += '<button type="button" class="count-btn' + (i === state.count ? ' active' : '') + '" onclick="setCount(' + i + ')">' + i + '</button>';
  }
  document.getElementById('countRow').innerHTML = countHtml;

  var nameHtml = '';
  for (var j = 0; j < state.count; j++) {
    var val = state.names[j] || defaultName(j);
    nameHtml += '<div class="name-row"><span class="idx">' + (j + 1) + ' 队</span>';
    nameHtml += '<input id="teamName' + j + '" maxlength="12" value="' + esc(val) + '"></div>';
  }
  document.getElementById('nameList').innerHTML = nameHtml;
}

function setCount(n) {
  state.count = n;
  while (state.names.length < n) state.names.push(defaultName(state.names.length));
  state.names.length = n;
  renderSetup();
}

function startGame() {
  var names = [];
  for (var i = 0; i < state.count; i++) {
    var el = document.getElementById('teamName' + i);
    var v = el ? el.value.trim() : '';
    names.push(v || defaultName(i));
  }
  state.names = names;
  state.scores = [];
  for (var j = 0; j < state.count; j++) state.scores.push(0);
  saveState();
  showBoard();
}

// ---- 计分面板 ----
function showBoard() {
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('boardPanel').style.display = '';
  renderBoard();
}

function renderBoard() {
  var max = Math.max.apply(null, state.scores);
  var leaders = [];
  state.scores.forEach(function (s, i) {
    if (s === max) leaders.push(i);
  });
  var leaderText;
  if (state.names.length === 0) {
    leaderText = '暂无队伍';
  } else if (leaders.length > 1) {
    var names = leaders.map(function (i) { return state.names[i]; }).join('、');
    leaderText = '当前并列：' + names + '（' + max + ' 分）';
  } else {
    leaderText = '当前领先：' + state.names[leaders[0]] + '（' + max + ' 分）';
  }
  document.getElementById('leaderLine').textContent = leaderText;

  var html = '';
  state.names.forEach(function (n, i) {
    html += '<div class="team-card">';
    html += '<div class="team-top"><span class="team-name">' + esc(n) + '</span><span class="score" id="score' + i + '">' + state.scores[i] + '</span></div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="score-btn add" onclick="addScore(' + i + ',1)">+1</button>';
    html += '<button type="button" class="score-btn add" onclick="addScore(' + i + ',5)">+5</button>';
    html += '<button type="button" class="score-btn add" onclick="addScore(' + i + ',10)">+10</button>';
    html += '<button type="button" class="score-btn sub" onclick="addScore(' + i + ',-1)">-1</button>';
    html += '<button type="button" class="score-btn sub" onclick="addScore(' + i + ',-5)">-5</button>';
    html += '</div></div>';
  });
  document.getElementById('teamList').innerHTML = html;
}

function addScore(i, delta) {
  if (i < 0 || i >= state.scores.length) return;
  state.scores[i] += delta;
  saveState();
  renderBoard();
  var el = document.getElementById('score' + i);
  if (el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

function resetScores() {
  if (!confirm('确定将所有队伍分数重置为 0？')) return;
  for (var i = 0; i < state.scores.length; i++) state.scores[i] = 0;
  saveState();
  renderBoard();
}

function reSetup() {
  document.getElementById('boardPanel').style.display = 'none';
  document.getElementById('setupPanel').style.display = '';
  renderSetup();
}

function clearSave() {
  if (!confirm('确定清除存档？分数与队名都会被删除。')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  state = { count: 4, names: [], scores: [] };
  reSetup();
}

// ---- 初始化 ----
(function init() {
  var saved = lsGet(STORE_KEY, null);
  if (saved && Array.isArray(saved.names) && Array.isArray(saved.scores) &&
      saved.names.length >= MIN_TEAMS && saved.names.length <= MAX_TEAMS &&
      saved.names.length === saved.scores.length) {
    state = {
      count: saved.names.length,
      names: saved.names,
      scores: saved.scores.map(function (v) { return typeof v === 'number' ? v : 0; })
    };
    showBoard();
  } else {
    renderSetup();
  }
})();
</script>

</body>
</html>
