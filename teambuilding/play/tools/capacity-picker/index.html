var CATS = [{"id": "icebreaker", "name": "🧊 破冰热场"}, {"id": "communication", "name": "💬 沟通表达"}, {"id": "collaboration", "name": "🤝 团队协作"}, {"id": "trust", "name": "🤖 信任建立"}, {"id": "leadership", "name": "👑 领导力"}, {"id": "creativity", "name": "💡 创意解题"}, {"id": "problem-solving", "name": "🔧 问题解决"}, {"id": "jubensha", "name": "🎭 剧本杀"}, {"id": "variety", "name": "📺 综艺娱乐"}, {"id": "boardgame", "name": "🎲 桌游团建"}];
var CAT_ICON = {"icebreaker": "🧊", "communication": "💬", "collaboration": "🤝", "trust": "🤖", "leadership": "👑", "creativity": "💡", "problem-solving": "🔧", "jubensha": "🎭", "variety": "📺", "boardgame": "🎲"};
var CAT_NAME = {"icebreaker": "破冰热场", "communication": "沟通表达", "collaboration": "团队协作", "trust": "信任建立", "leadership": "领导力", "creativity": "创意解题", "problem-solving": "问题解决", "jubensha": "剧本杀", "variety": "综艺娱乐", "boardgame": "桌游团建"};

var state = { domains: [], people: 0, mins: 0, venue: '', cat: '' };

function selectedTagSet() {
  var s = {};
  state.domains.forEach(function (id) {
    DOMAINS.forEach(function (d) {
      if (d.id === id) d.tags.forEach(function (t) { s[t] = true; });
    });
  });
  return s;
}

function matchCount(g, tagSet) {
  if (!state.domains.length) return 0;
  var n = 0;
  g.abilities.forEach(function (a) { if (tagSet[a]) n++; });
  return n;
}

function filtered() {
  var tagSet = selectedTagSet();
  var list = GAMES.filter(function (g) {
    if (state.cat && g.cat !== state.cat) return false;
    if (state.people) { if (g.unit === 'group') { if (state.people < g.pmin) return false; } else if (!(g.pmin <= state.people && g.pmax >= state.people)) return false; }
    if (state.mins && g.mins > state.mins) return false;
    if (state.venue === 'indoor' && g.venue === 'outdoor') return false;
    if (state.venue === 'outdoor' && g.venue === 'indoor') return false;
    if (state.domains.length && matchCount(g, tagSet) === 0) return false;
    return true;
  });
  list.forEach(function (g) { g._hits = matchCount(g, tagSet); });
  list.sort(function (a, b) {
    if (b._hits !== a._hits) return b._hits - a._hits;
    return a.name.localeCompare(b.name, 'zh');
  });
  return list;
}

function venueText(v) { return v === 'both' ? '室内/户外' : (v === 'outdoor' ? '户外' : '室内'); }

function render() {
  var tagSet = selectedTagSet();
  var list = filtered();
  document.getElementById('count').innerHTML = '共 <b>' + list.length + '</b> 款游戏符合条件' +
    (state.domains.length ? '（按命中能力数排序）' : '（未选能力域，按名称排序）');
  var grid = document.getElementById('grid');
  var html = '';
  list.forEach(function (g) {
    var tags = g.abilities.map(function (a) {
      var hit = tagSet[a] ? ' hit' : '';
      return '<span class="tag' + hit + '">' + a + '</span>';
    }).join('');
    html += '<a class="card" href="../../../' + g.url + '">' +
      '<div class="head"><span class="cat-ico">' + CAT_ICON[g.cat] + '</span><span class="name">' + g.name + '</span></div>' +
      '<div class="meta">' + CAT_NAME[g.cat] + ' · ' + g.pmin + '-' + g.pmax + '人 · 约' + g.mins + '分钟 · ' + venueText(g.venue) + '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="go">查看完整指南 →</div>' +
      '</a>';
  });
  grid.innerHTML = html;
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}

function buildChips() {
  var dc = document.getElementById('domainChips');
  DOMAINS.forEach(function (d) {
    var el = document.createElement('span');
    el.className = 'chip';
    el.textContent = d.icon + ' ' + d.label;
    el.onclick = function () {
      var i = state.domains.indexOf(d.id);
      if (i >= 0) { state.domains.splice(i, 1); el.classList.remove('on'); }
      else { state.domains.push(d.id); el.classList.add('on'); }
      render();
    };
    dc.appendChild(el);
  });
  var cc = document.getElementById('catChips');
  CATS.forEach(function (c) {
    var el = document.createElement('span');
    el.className = 'chip cat';
    el.textContent = c.icon + ' ' + c.name;
    el.onclick = function () {
      if (state.cat === c.id) {
        state.cat = '';
        el.classList.remove('on');
        document.getElementById('cat').value = '';
      } else {
        state.cat = c.id;
        el.classList.add('on');
        document.getElementById('cat').value = c.id;
      }
      render();
    };
    cc.appendChild(el);
  });
}

function bindSelects() {
  document.getElementById('people').onchange = function () { state.people = +this.value; render(); };
  document.getElementById('mins').onchange = function () { state.mins = +this.value; render(); };
  document.getElementById('venue').onchange = function () { state.venue = this.value; render(); };
  var catSel = document.getElementById('cat');
  CATS.forEach(function (c) {
    var o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.icon + ' ' + c.name;
    catSel.appendChild(o);
  });
  catSel.onchange = function () {
    state.cat = this.value;
    var chips = document.getElementById('catChips').children;
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('on', CATS[i].id === state.cat);
    }
    render();
  };
  document.getElementById('reset').onclick = function () {
    state = { domains: [], people: 0, mins: 0, venue: '', cat: '' };
    document.getElementById('people').value = '0';
    document.getElementById('mins').value = '0';
    document.getElementById('venue').value = '';
    catSel.value = '';
    var chips = document.getElementById('domainChips').children;
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
    var cchips = document.getElementById('catChips').children;
    for (var j = 0; j < cchips.length; j++) cchips[j].classList.remove('on');
    render();
  };
}

buildChips();
bindSelects();
render();
</script>
