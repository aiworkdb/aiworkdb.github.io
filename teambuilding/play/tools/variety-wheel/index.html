<div class="hero">
  <h1>🎡 综艺游戏转盘</h1>
  <p>今晚玩什么？转一下就知道</p>
</div>

<div class="wrap">

  <div class="card">
    <h2>先过滤，再转盘</h2>
    <div class="filter-label">人数规模</div>
    <div class="chip-row" id="peopleChips">
      <button class="chip active" data-v="all">不限</button>
      <button class="chip" data-v="s">10 人以内</button>
      <button class="chip" data-v="m">10–20 人</button>
      <button class="chip" data-v="l">20 人以上</button>
    </div>
    <div class="filter-label">场地</div>
    <div class="chip-row" id="venueChips">
      <button class="chip active" data-v="all">不限</button>
      <button class="chip" data-v="indoor">室内</button>
      <button class="chip" data-v="outdoor">户外 / 园区</button>
    </div>
    <div class="hint">剧本杀与综艺共 12 款新游戏 + 8 款经典游戏，按条件过滤后从转盘随机抽。</div>
  </div>

  <div class="card">
    <div class="wheel-box">
      <div class="pointer">▼</div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <button class="btn big" id="spinBtn">开始转盘</button>
    <div class="count-line" id="countLine"></div>
  </div>

  <div class="card result" id="resultCard">
    <div class="r-name" id="rName"></div>
    <div class="r-tags" id="rTags"></div>
    <div class="r-rule" id="rRule"></div>
    <a class="r-link" id="rLink" href="#" target="_blank" rel="noopener"></a>
    <div class="btn-row">
      <button class="btn ghost" id="againBtn">再转一次</button>
      <button class="btn" id="goBtn">查看完整规则</button>
    </div>
  </div>

</div>

<div class="footer">

  <a href="https://ai.aitboy.cn/teambuilding/">游戏库首页</a>
</div>

  { name: '黄金结界 · 团队守护版（Huntrix: Golden Honmoon）', cat: '团队协作', pmin: 3, pmax: 5, venue: 'indoor', mins: '45–75 分钟', rule: '《黄金结界 · 团队守护版》把原作"偶像女团暗中守护人间"的内核，搬进了一支高绩效团队的文化与心理资本守护现场。', url: '../../../games/collaboration/huntrix-honmoon.html' },
  { name: '齐眉棍（手指传棍）', cat: '团队协作', pmin: 6, pmax: 10, venue: 'both', mins: '20–30 分钟', rule: '让团队体验「每个人都对，但结果错了」的经典协作困境，理解系统思维和互相配合。', url: '../../../games/collaboration/eyebrow-stick.html' },
];

var PALETTE = ['#5b8cfe','#ff8a4c','#25c2b8','#a78bfa','#f6b73c','#ef7d9a','#4ecdc4','#8d9eef','#f0925b','#57c4ad','#c4a3f5','#f2c14e'];

var peopleFilter = 'all', venueFilter = 'all';
var rotation = 0;          // 当前角度（度）
var spinning = false;
var currentList = [];

var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');

function inPeopleRange(g) {
  if (peopleFilter === 'all') return true;
  if (peopleFilter === 's') return g.pmin <= 10;
  if (peopleFilter === 'm') return g.pmax >= 10 && g.pmin <= 20;
  if (peopleFilter === 'l') return g.pmax >= 20;
  return true;
}
function inVenueRange(g) {
  if (venueFilter === 'all') return true;
  if (venueFilter === 'indoor') return g.venue === 'indoor' || g.venue === 'both';
  if (venueFilter === 'outdoor') return g.venue === 'outdoor' || g.venue === 'both';
  return true;
}
function filtered() {
  return GAMES.filter(function (g) { return inPeopleRange(g) && inVenueRange(g); });
}

function draw(list) {
  var n = list.length;
  var size = canvas.width;
  var cx = size / 2, cy = size / 2, r = size / 2 - 8;
  ctx.clearRect(0, 0, size, size);
  if (n === 0) {
    ctx.fillStyle = '#eef0f4';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#999';
    ctx.font = '26px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('没有符合条件的游戏', cx, cy);
    return;
  }
  var seg = (Math.PI * 2) / n;
  for (var i = 0; i < n; i++) {
    var a0 = rotation * Math.PI / 180 + i * seg;
    var a1 = a0 + seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    // 文字
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a0 + seg / 2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px -apple-system,"PingFang SC",sans-serif';
    var label = list[i].name;
    if (label.length > 6) label = label.slice(0, 6);
    ctx.fillText(label, r - 26, 0);
    ctx.restore();
  }
  // 中心轴
  ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#1a1a2e'; ctx.stroke();
  ctx.fillStyle = '#1a1a2e';
  ctx.font = 'bold 22px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('GO', cx, cy);
}

function refresh() {
  currentList = filtered();
  document.getElementById('countLine').textContent =
    currentList.length ? ('当前候选 ' + currentList.length + ' 款，转到谁玩谁') : '当前条件下没有游戏，放宽筛选试试';
  document.getElementById('resultCard').classList.remove('show');
  draw(currentList);
}

function spin() {
  if (spinning || currentList.length === 0) return;
  spinning = true;
  document.getElementById('resultCard').classList.remove('show');
  var n = currentList.length;
  var seg = 360 / n;
  // 指针在正上方：选中第 idx 片，最终旋转角使该片中心对准指针
  var idx = Math.floor(Math.random() * n);
  var target = 360 * 5 + (360 - (idx * seg + seg / 2)); // 多转 5 圈 + 对齐
  var start = rotation % 360;
  var delta = target - start + (target < start ? 360 : 0);
  var dur = 2600;
  var t0 = null;
  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3); // easeOutCubic
    rotation = start + delta * e;
    draw(currentList);
    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      rotation = (start + delta) % 360;
      spinning = false;
      showResult(currentList[idx]);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(g) {
  document.getElementById('rName').textContent = g.name;
  var tags = [g.cat, g.pmin + '–' + g.pmax + ' 人', g.mins,
    g.venue === 'indoor' ? '室内' : (g.venue === 'outdoor' ? '户外/园区' : '室内/户外')];
  document.getElementById('rTags').innerHTML = tags.map(function (t) {
    return '<span class="r-tag">' + t + '</span>';
  }).join('');
  document.getElementById('rRule').textContent = g.rule;
  var link = document.getElementById('rLink');
  link.href = g.url;
  link.textContent = '📖 查看《' + g.name + '》完整规则与安全条款';
  document.getElementById('goBtn').onclick = function () { window.open(g.url, '_blank'); };
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 筛选 chips
function bindChips(id, cb) {
  var box = document.getElementById(id);
  box.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    box.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
    btn.classList.add('active');
    cb(btn.dataset.v);
  });
}
bindChips('peopleChips', function (v) { peopleFilter = v; refresh(); });
bindChips('venueChips', function (v) { venueFilter = v; refresh(); });

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('againBtn').addEventListener('click', spin);

refresh();
</script>
