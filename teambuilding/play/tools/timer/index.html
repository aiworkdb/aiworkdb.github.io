<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T3 环节计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .hero { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d5e 100%); color: #fff; padding: 36px 20px 26px; text-align: center; }
  .hero h1 { font-size: 1.5em; margin-bottom: 8px; }
  .hero p { font-size: 0.92em; opacity: 0.85; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 100px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05em; margin-bottom: 12px; }
  .seg-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid #e2e6ee; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .seg-row.cur { border-color: #5b8cfe; background: #eef2ff; }
  .seg-info b { font-size: 0.95em; }
  .seg-info .seg-min { font-size: 0.8em; color: #5b8cfe; margin-left: 8px; }
  .seg-actions { display: flex; gap: 6px; }
  .btn { display: inline-block; padding: 10px 16px; border: none; border-radius: 8px; font-size: 0.92em; cursor: pointer; text-align: center; background: #5b8cfe; color: #fff; }
  .btn:active { transform: scale(0.98); }
  .btn.sm { padding: 7px 12px; font-size: 0.82em; }
  .btn.ghost { background: #fff; color: #5b8cfe; border: 1px solid #5b8cfe; }
  .btn.gray { background: #e2e6ee; color: #666; }
  .btn.primary { padding: 12px 22px; font-size: 1em; }
  .add-row { display: flex; gap: 8px; margin: 12px 0 10px; }
  .add-row input { flex: 1; border: 1px solid #d0d5e0; border-radius: 8px; padding: 10px 12px; font-size: 0.92em; font-family: inherit; }
  .add-row input:focus { outline: none; border-color: #5b8cfe; }
  .add-row input.num { max-width: 80px; text-align: center; }
  .timer-card { text-align: center; padding: 26px 18px; }
  .seg-title { font-size: 1em; color: #666; margin-bottom: 6px; }
  .time { font-size: 4.4em; font-weight: 700; font-variant-numeric: tabular-nums; color: #1a1a2e; letter-spacing: 2px; }
  .bar { height: 10px; background: #e2e6ee; border-radius: 5px; overflow: hidden; margin: 12px auto 6px; max-width: 420px; }
  .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #5b8cfe, #3366cc); border-radius: 5px; transition: width 0.4s linear; }
  .phase { font-size: 0.92em; color: #5b8cfe; font-weight: 600; min-height: 1.5em; margin: 6px 0 14px; }
  .phase.end { color: #e0563f; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .empty { color: #999; font-size: 0.88em; text-align: center; padding: 16px 0; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e2e6ee; padding: 12px 16px; text-align: center; }
  .footer a { color: #5b8cfe; font-size: 0.9em; text-decoration: none; margin: 0 12px; }
</style>
</head>
<body>

<div class="hero no-print">
  <h1>环节计时器</h1>
  <p>多环节倒计时控场 · 时间到有提示音</p>
</div>

<div class="wrap">
  <div class="card no-print">
    <h2>环节列表</h2>
    <div id="segList"></div>
    <div class="add-row">
      <input id="newName" placeholder="环节名称，如：团队游戏">
      <input id="newMin" class="num" type="number" min="1" max="600" value="10">
      <button type="button" class="btn" onclick="addSegment()">添加</button>
    </div>
    <button type="button" class="btn gray" onclick="clearSegments()">清空全部</button>
  </div>

  <div class="card timer-card" id="timerCard">
    <div class="seg-title" id="curName">开场破冰 · 15 分钟</div>
    <div class="time" id="timeDisplay">15:00</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="phase" id="phaseText">准备开始</div>
    <div class="btn-row">
      <button type="button" class="btn primary" id="startBtn" onclick="toggleStart()">开始</button>
      <button type="button" class="btn ghost" onclick="nextSegment()">跳过</button>
      <button type="button" class="btn ghost" onclick="resetCurrent()">重置当前</button>
    </div>
  </div>
</div>

<div class="footer no-print">
  <a href="../../index.html">返回产品总览</a>
  <a href="https://ai.aitboy.cn/teambuilding/">团建游戏库</a>
</div>

<script>
var segments = [];          // [{name, minutes}]
var currentIndex = 0;
var remaining = 0;          // 剩余秒数
var total = 0;              // 当前环节总秒数
var running = false;
var timerId = null;
var endedFlash = false;     // 是否刚提示"时间到"
var audioCtx = null;

var STORE_KEY = 'tt_segments_v1';

// ---- localStorage 容错 ----
function lsGet(k, d) {
  try {
    var v = localStorage.getItem(k);
    return v ? JSON.parse(v) : d;
  } catch (e) { return d; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function loadSegments() {
  var d = lsGet(STORE_KEY, null);
  if (Array.isArray(d) && d.length > 0) {
    segments = d;
  } else {
    segments = [
      { name: '开场破冰', minutes: 15 },
      { name: '主游戏', minutes: 45 },
      { name: '复盘总结', minutes: 20 }
    ];
  }
}

function saveSegments() { lsSet(STORE_KEY, segments); }

// ---- 渲染 ----
function renderAll() {
  renderSegList();
  renderTimer();
}

function renderSegList() {
  var html = '';
  if (segments.length === 0) {
    html = '<p class="empty">暂无环节，请在下方添加</p>';
  }
  segments.forEach(function (s, i) {
    html += '<div class="seg-row' + (i === currentIndex ? ' cur' : '') + '">';
    html += '<div class="seg-info"><b>' + esc(s.name) + '</b><span class="seg-min">' + s.minutes + ' 分钟</span></div>';
    html += '<div class="seg-actions">';
    html += '<button type="button" class="btn sm ghost" onclick="selectSegment(' + i + ')">从此开始</button>';
    html += '<button type="button" class="btn sm gray" onclick="removeSegment(' + i + ')">删除</button>';
    html += '</div></div>';
  });
  document.getElementById('segList').innerHTML = html;
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function renderTimer() {
  if (segments.length === 0) {
    document.getElementById('curName').textContent = '暂无环节';
    document.getElementById('timeDisplay').textContent = '00:00';
    document.getElementById('barFill').style.width = '0%';
    document.getElementById('phaseText').textContent = '请先添加环节';
    document.getElementById('startBtn').textContent = '开始';
    return;
  }
  var s = segments[currentIndex];
  document.getElementById('curName').textContent = s.name + ' · ' + s.minutes + ' 分钟';
  document.getElementById('timeDisplay').textContent = pad(Math.floor(remaining / 60)) + ':' + pad(remaining % 60);
  var pct = total > 0 ? Math.round((1 - remaining / total) * 100) : 0;
  document.getElementById('barFill').style.width = Math.max(0, Math.min(100, pct)) + '%';
  var phaseEl = document.getElementById('phaseText');
  if (running) {
    phaseEl.textContent = '进行中';
    phaseEl.className = 'phase';
  } else if (endedFlash || remaining <= 0) {
    phaseEl.textContent = '时间到！';
    phaseEl.className = 'phase end';
  } else {
    phaseEl.textContent = '已就绪';
    phaseEl.className = 'phase';
  }
  document.getElementById('startBtn').textContent = running ? '暂停' : '开始';
}

// ---- 环节操作 ----
function selectSegment(i) {
  if (i < 0 || i >= segments.length) return;
  currentIndex = i;
  total = segments[i].minutes * 60;
  remaining = total;
  running = false;
  endedFlash = false;
  stopTick();
  renderAll();
}

function addSegment() {
  var name = document.getElementById('newName').value.trim();
  var min = parseInt(document.getElementById('newMin').value, 10);
  if (!name) { alert('请输入环节名称'); return; }
  if (!min || min < 1 || min > 600) { alert('请输入 1-600 之间的分钟数'); return; }
  segments.push({ name: name, minutes: min });
  saveSegments();
  document.getElementById('newName').value = '';
  document.getElementById('newMin').value = 10;
  renderAll();
}

function removeSegment(i) {
  segments.splice(i, 1);
  if (currentIndex >= segments.length) currentIndex = segments.length - 1;
  if (currentIndex < 0) { currentIndex = 0; total = 0; remaining = 0; }
  if (segments.length > 0 && currentIndex < segments.length) {
    total = segments[currentIndex].minutes * 60;
    remaining = total;
  }
  running = false;
  endedFlash = false;
  stopTick();
  saveSegments();
  renderAll();
}

function clearSegments() {
  if (!confirm('确定清空全部环节？')) return;
  segments = [];
  currentIndex = 0;
  total = 0;
  remaining = 0;
  running = false;
  endedFlash = false;
  stopTick();
  saveSegments();
  renderAll();
}

// ---- 计时控制 ----
function toggleStart() {
  if (segments.length === 0) { alert('请先添加环节'); return; }
  if (remaining <= 0) { remaining = total; endedFlash = false; }
  if (running) {
    stopTick();
    running = false;
  } else {
    ensureAudio();
    running = true;
    timerId = setInterval(tick, 1000);
  }
  renderAll();
}

function stopTick() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function tick() {
  remaining--;
  if (remaining <= 0) {
    remaining = 0;
    stopTick();
    running = false;
    endedFlash = true;
    beep();
    // 自动高亮下一环节（不自动开始）
    if (currentIndex < segments.length - 1) {
      currentIndex++;
      total = segments[currentIndex].minutes * 60;
      remaining = total;
    }
  }
  renderAll();
}

function nextSegment() {
  if (segments.length === 0) return;
  currentIndex = (currentIndex + 1) % segments.length;
  total = segments[currentIndex].minutes * 60;
  remaining = total;
  running = false;
  endedFlash = false;
  stopTick();
  renderAll();
}

function resetCurrent() {
  if (segments.length === 0) return;
  total = segments[currentIndex].minutes * 60;
  remaining = total;
  running = false;
  endedFlash = false;
  stopTick();
  renderAll();
}

// ---- 提示音（Web Audio API，纯本地）----
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.28, 0.56].forEach(function (t) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + t);
      osc.stop(audioCtx.currentTime + t + 0.24);
    });
  } catch (e) {}
}

// ---- 初始化 ----
loadSegments();
if (segments.length > 0) {
  currentIndex = 0;
  total = segments[0].minutes * 60;
  remaining = total;
}
renderAll();
</script>

</body>
</html>
