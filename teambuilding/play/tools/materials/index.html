  .btn.ghost { background: #fff; color: #5b8cfe; border: 1px solid #5b8cfe; }
  .btn.gray { background: #e2e6ee; color: #666; }

  .game-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e2e6ee; border-radius: 8px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .game-item:active { background: #f5f8ff; }
  .game-item input { width: 20px; height: 20px; flex: none; }
  .game-item .g-name { flex: 1; font-size: 0.95em; }
  .game-item .g-cnt { font-size: 0.78em; color: #999; }
  .summary-line { font-size: 0.9em; color: #666; margin: 6px 0 2px; }
  .summary-line b { color: #5b8cfe; }
  .result-meta { font-size: 0.9em; color: #666; background: #eef2ff; border: 1px solid #c9d6ff; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  .group-title { font-size: 0.95em; margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 2px solid #e2e6ee; }
  .mat-list { list-style: none; }
  .mat-list li { display: flex; align-items: baseline; gap: 8px; padding: 8px 4px; border-bottom: 1px dashed #e8ebf1; font-size: 0.92em; }
  .mat-list li b { flex: 1; }
  .mat-list li .qty { color: #5b8cfe; font-weight: 600; white-space: nowrap; }
  .mat-list li em { font-style: normal; font-size: 0.78em; color: #999; white-space: nowrap; }
  .empty { color: #999; font-size: 0.88em; text-align: center; padding: 16px 0; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e2e6ee; padding: 12px 16px; text-align: center; }
  .footer a { color: #5b8cfe; font-size: 0.9em; text-decoration: none; margin: 0 12px; }
  @media print {
    .no-print { display: none !important; }

    .wrap { padding: 0; max-width: 100%; }

    .footer { display: none; }

</head>
<body>

<div class="hero no-print">
  <h1>物资清单生成器</h1>
  <p>勾选游戏 → 一键生成带数量建议的物资清单</p>
</div>

<div class="wrap">
  <div class="card no-print">
    <h2>勾选游戏</h2>
    <p class="hint">勾选游戏 → 一键生成带数量建议的物资清单，可打印带去现场</p>
    <input id="search" class="search-box" placeholder="搜索游戏名称…" oninput="renderGameList()">
    <div id="gameList"></div>
    <div class="summary-line">已选 <b id="selCount">0</b> 款游戏</div>
    <div class="btn-row">
      <button type="button" class="btn primary" onclick="generate()">生成物资清单</button>
      <button type="button" class="btn gray" onclick="clearSelection()">清空选择</button>
    </div>
  </div>

  <div class="card" id="resultPanel" style="display:none">
    <h2>物资清单</h2>
    <div class="result-meta" id="resultMeta"></div>
    <div id="resultGroups"></div>
    <div class="btn-row no-print">
      <button type="button" class="btn primary" onclick="window.print()">打印清单</button>
      <button type="button" class="btn ghost" onclick="backToSelect()">返回修改</button>
    </div>
  </div>
</div>

<div class="footer no-print">
  <a href="../../index.html">返回产品总览</a>
  <a href="https://ai.aitboy.cn/teambuilding/">团建游戏库</a>
</div>

var sel = {};        // 选中状态 index -> true
var filterText = '';

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---- 游戏勾选列表 ----
function renderGameList() {
  filterText = (document.getElementById('search').value || '').trim().toLowerCase();
  var html = '';
  var count = 0;
  GAMES.forEach(function (g, i) {
    if (filterText && g.name.toLowerCase().indexOf(filterText) < 0) return;
    count++;
    html += '<label class="game-item">';
    html += '<input type="checkbox" data-i="' + i + '"' + (sel[i] ? ' checked' : '') + ' onchange="toggleSel(' + i + ', this.checked)">';
    html += '<span class="g-name">' + esc(g.name) + '</span>';
    html += '<span class="g-cnt">' + g.materials.length + ' 项物资</span>';
    html += '</label>';
  });
  document.getElementById('gameList').innerHTML = html || '<p class="empty">没有匹配的游戏</p>';
  updateSelCount();
}

function toggleSel(i, checked) {
  if (checked) sel[i] = true; else delete sel[i];
  updateSelCount();
}

function updateSelCount() {
  var n = 0;
  Object.keys(sel).forEach(function (k) { if (sel[k]) n++; });
  document.getElementById('selCount').textContent = n;
}

function clearSelection() {
  if (!confirm('确定清空所有勾选？')) return;
  sel = {};
  renderGameList();
}

// ---- 生成物资清单 ----
var CAT_ORDER = ['道具类', '打印类', '通用类'];
var PRINT_KEYWORDS = ['卡', '清单', '表', '题', '单', '券'];
var COMMON_KEYWORDS = ['笔', '白板', '纸', '胶带', '剪刀', '计时'];

function classify(name) {
  for (var i = 0; i < PRINT_KEYWORDS.length; i++) {
    if (name.indexOf(PRINT_KEYWORDS[i]) >= 0) return '打印类';
  }
  for (var j = 0; j < COMMON_KEYWORDS.length; j++) {
    if (name.indexOf(COMMON_KEYWORDS[j]) >= 0) return '通用类';
  }
  return '道具类';
}

// 同名物资合并时，根据各款游戏的数量建议生成范围文案（如「1-2 支/人」）
function qtyRangeText(qtys) {
  if (!qtys || qtys.length <= 1) return qtys && qtys[0] ? qtys[0] : '';
  var nums = [];
  var unitByNum = {};
  var allParsed = true;
  qtys.forEach(function (q) {
    var m = String(q).match(/^(\d+(?:\.\d+)?)\s*([^\d]*)$/);
    if (m) {
      var n = parseFloat(m[1]);
      nums.push(n);
      if (!(n in unitByNum)) unitByNum[n] = (m[2] || '').trim();
    } else {
      allParsed = false;
    }
  });
  // 有无法解析的数量时，保守起见保留首个文案
  if (!allParsed || nums.length === 0) return qtys[0];
  var min = Math.min.apply(null, nums);
  var max = Math.max.apply(null, nums);
  if (min === max) return qtys[0];
  var unit = unitByNum[min] || '';
  return min + '-' + max + (unit ? ' ' + unit : '');
}

function generate() {
  var selected = [];
  GAMES.forEach(function (g, i) {
    if (sel[i]) selected.push(g);
  });
  if (selected.length === 0) {
    alert('请先勾选至少一个游戏');
    return;
  }

  // 汇总并去重（同名物资合并，记录出现次数与全部数量建议）
  var map = {};
  var totalOccur = 0;
  selected.forEach(function (g) {
    g.materials.forEach(function (m) {
      totalOccur++;
      if (!map[m.name]) map[m.name] = { name: m.name, qty: m.qty, qtys: [], games: [] };
      map[m.name].qtys.push(m.qty);
      map[m.name].games.push(g.name);
    });
  });

  var items = Object.keys(map).map(function (k) {
    var it = map[k];
    it.qty = qtyRangeText(it.qtys);
    return it;
  });
  var groups = { '道具类': [], '打印类': [], '通用类': [] };
  items.forEach(function (it) {
    groups[classify(it.name)].push(it);
  });

  var meta = '已选 ' + selected.length + ' 款游戏 · 汇总物资 ' + items.length + ' 项（去重后）· 合计出现 ' + totalOccur + ' 次';
  document.getElementById('resultMeta').textContent = meta;

  var html = '';
  CAT_ORDER.forEach(function (cat) {
    var list = groups[cat];
    if (!list.length) return;
    html += '<h3 class="group-title">' + cat + '（' + list.length + ' 项）</h3>';
    html += '<ul class="mat-list">';
    list.forEach(function (it) {
      html += '<li><b>' + esc(it.name) + '</b>';
      html += '<span class="qty">' + esc(it.qty) + '</span>';
      if (it.games.length > 1) {
        html += '<em>· ' + it.games.length + ' 款游戏需要</em>';
      }
      html += '</li>';
    });
    html += '</ul>';
  });
  document.getElementById('resultGroups').innerHTML = html;

  document.getElementById('resultPanel').style.display = '';
  document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function backToSelect() {
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('search').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

renderGameList();
