<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G5 我从未</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .hero { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d5e 100%); color: #fff; padding: 36px 20px 26px; text-align: center; }
  .hero h1 { font-size: 1.5em; margin-bottom: 8px; }
  .hero p { font-size: 0.92em; opacity: 0.85; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 100px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05em; margin-bottom: 8px; }
  .hint { font-size: 0.85em; color: #888; margin-bottom: 12px; }
  .btn { display: inline-block; padding: 10px 16px; border: none; border-radius: 8px; font-size: 0.92em; cursor: pointer; text-align: center; background: #5b8cfe; color: #fff; font-family: inherit; }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: #fff; color: #5b8cfe; border: 1px solid #5b8cfe; }
  .btn.gray { background: #e2e6ee; color: #666; }
  .btn.primary { padding: 12px 22px; font-size: 1em; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .count-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .count-btn { flex: 1; min-width: 44px; padding: 10px 0; border-radius: 8px; border: 1px solid #d0d5e0; background: #fff; font-size: 1em; cursor: pointer; font-family: inherit; color: #1a1a2e; }
  .count-btn.active { background: #5b8cfe; border-color: #5b8cfe; color: #fff; font-weight: 700; }
  .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .name-row .idx { width: 30px; color: #999; font-size: 0.9em; }
  .name-row input { flex: 1; border: 1px solid #d0d5e0; border-radius: 8px; padding: 10px 12px; font-size: 0.92em; font-family: inherit; }
  .name-row input:focus { outline: none; border-color: #5b8cfe; }
  .players-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: #eef2ff; border: 1px solid #c9d6ff; color: #3366cc; font-size: 0.85em; font-weight: 600; }
  .chip.cur { background: #5b8cfe; color: #fff; border-color: #5b8cfe; }
  .chip .chip-score { font-weight: 700; margin-left: 4px; }
  .card-flip { text-align: center; padding: 34px 20px; background: linear-gradient(135deg, #fff 0%, #f0f4ff 100%); border: 2px solid #dbe4ff; }
  .card-label { font-size: 0.9em; font-weight: 700; color: #5b8cfe; letter-spacing: 6px; margin-bottom: 18px; }
  .card-text { font-size: 1.5em; font-weight: 700; line-height: 1.6; color: #1a1a2e; min-height: 3.2em; display: flex; align-items: center; justify-content: center; }
  .card-text.placeholder { font-size: 1em; color: #aaa; font-weight: 400; }
  .card-text.anim { animation: flipIn 0.4s ease; }
  @keyframes flipIn { 0% { transform: rotateX(60deg) scale(0.9); opacity: 0; } 100% { transform: rotateX(0) scale(1); opacity: 1; } }
  .turn-line { text-align: center; font-size: 0.95em; color: #666; margin: 12px 0 4px; }
  .turn-line b { color: #1a1a2e; }
  .mark-box { border: 1px solid #e2e6ee; border-radius: 12px; padding: 12px; margin-top: 14px; }
  .mark-title { font-size: 0.85em; color: #666; margin-bottom: 8px; }
  .mark-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .mark-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #d0d5e0; background: #fff; font-size: 0.88em; cursor: pointer; font-family: inherit; color: #1a1a2e; }
  .mark-btn:active { transform: scale(0.97); }
  .mark-btn.marked { background: #fdeeed; border-color: #f5c6c0; color: #c0392b; }
  .rules { font-size: 0.82em; color: #999; background: #f5f7fa; border-radius: 8px; padding: 10px 12px; margin-top: 14px; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e2e6ee; padding: 12px 16px; text-align: center; }
  .footer a { color: #5b8cfe; font-size: 0.9em; text-decoration: none; margin: 0 12px; }
</style>
</head>
<body>

<div class="hero">
  <h1>我从未</h1>
  <p>"我从来没有……" 翻卡接龙 · 安全有趣了解彼此</p>
</div>

<div class="wrap">
  <!-- 设置 -->
  <div class="card" id="setupPanel">
    <h2>设置参与人数</h2>
    <p class="hint">选择人数（2-12），每人依次抽卡并说出「我从未…」</p>
    <div class="count-row" id="countRow"></div>
    <div id="nameList"></div>
    <div class="btn-row">
      <button type="button" class="btn primary" onclick="startGame()">开始游戏</button>
    </div>
  </div>

  <!-- 游戏 -->
  <div class="card" id="gamePanel" style="display:none">
    <div class="players-row" id="playersRow"></div>

    <div class="card-flip">
      <div class="card-label">我从未……</div>
      <div class="card-text placeholder" id="cardText">点「抽一张」翻卡</div>
    </div>

    <div class="turn-line" id="turnLine"></div>

    <div class="btn-row">
      <button type="button" class="btn primary" onclick="drawCard()">抽一张</button>
      <button type="button" class="btn ghost" onclick="changeCard()">换一张</button>
      <button type="button" class="btn primary" onclick="nextPlayer()">下一位</button>
    </div>

    <div class="mark-box">
      <div class="mark-title">做过的人（点击名字扣 1 分，再点取消）</div>
      <div class="mark-row" id="markRow"></div>
    </div>

    <div class="rules">玩法：抽卡者大声说出「我从来没有 X」，做过这件事的人点击自己的名字举手，每人扣 1 分。话题安全，娱乐为主，重在互动。</div>

    <div class="btn-row">
      <button type="button" class="btn gray" onclick="restart()">重新开始</button>
    </div>
  </div>
</div>

<div class="footer">
  <a href="../../index.html">返回产品总览</a>
  <a href="https://aiworkdb.github.io/teambuilding/">团建游戏库</a>
</div>

<script>
// 安全、职场/生活向话题卡（40+ 条）
var STATEMENTS = [
  '我从未养过宠物',
  '我从未凌晨三点还在加班',
  '我从未在办公室睡着过',
  '我从未吃过榴莲披萨',
  '我从未参加过马拉松',
  '我从未染过头发',
  '我从未坐过飞机头等舱',
  '我从未坚持健身超过三个月',
  '我从未在会议上睡着过',
  '我从未连续一周吃外卖',
  '我从未忘记过同事的名字',
  '我从未在电梯里遇到领导时假装看手机',
  '我从未说过"马上就好"却拖到第二天',
  '我从未删过工作群消息',
  '我从未因为追剧熬夜到天亮',
  '我从未在办公室吃过火锅',
  '我从未偷偷在工位午睡超过一小时',
  '我从未坐过摩天轮',
  '我从未参加过公司的年会表演',
  '我从未写过周报',
  '我从未在朋友圈发过加班照片',
  '我从未迟到过',
  '我从未吃过虫子做的食物',
  '我从未在旅行中迷过路',
  '我从未背过圆周率后十位',
  '我从未在唱歌比赛中拿过名次',
  '我从未骑过马',
  '我从未在冬天洗过冷水澡',
  '我从未用表情包回复过老板',
  '我从未在群里发过红包',
  '我从未看过完整的四大名著',
  '我从未学会过一种乐器',
  '我从未做过百米冲刺',
  '我从未在飞机上哭过',
  '我从未把咖啡洒在键盘上',
  '我从未因为工作哭过',
  '我从未说过"下次一定"却没做到',
  '我从未一个人看过电影',
  '我从未坚持写日记超过一个月',
  '我从未在沙漠里露营过',
  '我从未坐过绿皮火车的硬座',
  '我从未在阳台种过菜',
  '我从未在面试中紧张到语无伦次',
  '我从未骑过共享单车超过十公里'
];

var MIN_PLAYERS = 2;
var MAX_PLAYERS = 12;

var players = [];       // 玩家名
var scores = [];        // 玩家分数（做过扣分）
var currentPlayer = 0;  // 当前抽卡者
var usedIdx = [];       // 已用话题索引
var currentIdx = -1;    // 当前话题索引
var marked = {};        // 本轮已点过的人 playerIdx -> true

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function defaultName(i) { return '玩家' + (i + 1); }

// ---- 设置 ----
function renderSetup() {
  var countHtml = '';
  for (var i = MIN_PLAYERS; i <= MAX_PLAYERS; i++) {
    countHtml += '<button type="button" class="count-btn' + (i === players.length ? ' active' : '') + '" onclick="setCount(' + i + ')">' + i + '</button>';
  }
  document.getElementById('countRow').innerHTML = countHtml;

  var nameHtml = '';
  for (var j = 0; j < players.length; j++) {
    nameHtml += '<div class="name-row"><span class="idx">' + (j + 1) + '.</span>';
    nameHtml += '<input id="playerName' + j + '" maxlength="8" value="' + esc(players[j] || defaultName(j)) + '"></div>';
  }
  document.getElementById('nameList').innerHTML = nameHtml;
}

function setCount(n) {
  while (players.length < n) players.push(defaultName(players.length));
  players.length = n;
  renderSetup();
}

function startGame() {
  var names = [];
  for (var i = 0; i < players.length; i++) {
    var el = document.getElementById('playerName' + i);
    var v = el ? el.value.trim() : '';
    names.push(v || defaultName(i));
  }
  players = names;
  scores = [];
  for (var j = 0; j < players.length; j++) scores.push(0);
  currentPlayer = 0;
  usedIdx = [];
  currentIdx = -1;
  marked = {};
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('gamePanel').style.display = '';
  renderPlayers();
  drawCard();
}

function restart() {
  if (!confirm('确定重新开始？分数会被清空。')) return;
  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('setupPanel').style.display = '';
  renderSetup();
}

// ---- 抽卡 ----
function pickStatement() {
  if (usedIdx.length >= STATEMENTS.length) {
    usedIdx = [];
  }
  var idx;
  do {
    idx = Math.floor(Math.random() * STATEMENTS.length);
  } while (usedIdx.indexOf(idx) >= 0);
  usedIdx.push(idx);
  return idx;
}

function showCard(idx) {
  currentIdx = idx;
  var el = document.getElementById('cardText');
  el.classList.remove('placeholder');
  el.textContent = STATEMENTS[idx];
  el.classList.remove('anim');
  void el.offsetWidth;
  el.classList.add('anim');
  renderMarkRow();
  renderPlayers();
}

function drawCard() {
  marked = {};
  showCard(pickStatement());
}

function changeCard() {
  marked = {};
  showCard(pickStatement());
}

function nextPlayer() {
  currentPlayer = (currentPlayer + 1) % players.length;
  marked = {};
  drawCard();
}

// ---- 计分与标记 ----
function toggleMark(p) {
  if (marked[p]) {
    delete marked[p];
    scores[p] += 1;   // 取消标记，分数加回
  } else {
    marked[p] = true;
    scores[p] -= 1;   // 做过，扣 1 分
  }
  renderPlayers();
  renderMarkRow();
}

function renderPlayers() {
  var html = '';
  players.forEach(function (n, i) {
    html += '<span class="chip' + (i === currentPlayer ? ' cur' : '') + '">' + esc(n) + '<span class="chip-score">' + scores[i] + '</span></span>';
  });
  document.getElementById('playersRow').innerHTML = html;
  document.getElementById('turnLine').innerHTML = '轮到 <b>' + esc(players[currentPlayer]) + '</b> 抽卡';
}

function renderMarkRow() {
  var html = '';
  players.forEach(function (n, i) {
    var isMarked = !!marked[i];
    html += '<button type="button" class="mark-btn' + (isMarked ? ' marked' : '') + '" onclick="toggleMark(' + i + ')">' + esc(n) + (isMarked ? ' 已举手' : '') + '</button>';
  });
  document.getElementById('markRow').innerHTML = html;
}

// ---- 初始化 ----
(function init() {
  players = [defaultName(0), defaultName(1)];
  scores = [0, 0];
  renderSetup();
})();
</script>

</body>
</html>
