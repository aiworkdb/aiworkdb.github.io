<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>团建方案生成器 · 已升级</title>
<link rel="canonical" href="../play/tools/plan-generator/index.html">
<meta http-equiv="refresh" content="1; url=../play/tools/plan-generator/index.html">
<link rel="stylesheet" href="../assets/lib.css">
<style>
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px calc(40px + var(--safe-b));text-align:center}
  .icon{font-size:52px;line-height:1;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--ink-2);font-size:15px;line-height:1.75;margin:0 0 8px}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);
        box-shadow:var(--shadow);padding:22px 18px;margin:22px 0}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  a.btn{display:flex;align-items:center;justify-content:center;min-height:var(--tap);
        border-radius:var(--r-sm);font-size:16px;font-weight:600;text-decoration:none;
        padding:12px 18px}
  a.primary{background:var(--accent);color:#fff}
  a.ghost{background:var(--bg-soft);color:var(--ink);border:1px solid var(--line)}
  .tip{font-size:13px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">🛠️</div>
  <h1>方案生成器已升级</h1>
  <p>旧版只收录 22 款游戏、且不能导出，已停止维护。</p>

  <div class="card">
    <p><strong>新版方案生成器</strong>覆盖全部 <strong>86 款</strong>游戏，可按人数、时长、场地、目标筛选，并一键生成完整方案。</p>
    <div class="btns">
      <a class="btn primary" href="../play/tools/plan-generator/index.html">前往新版生成器 →</a>
      <a class="btn ghost" href="../index.html">返回游戏库</a>
    </div>
  </div>

  <p class="tip">页面会在 1 秒后自动跳转；若没反应，请点上面的按钮。</p>
</div>
</body>
</html>
