      <circle cx="-3" cy="-2" r="1.5" fill="#333"/>
      <circle cx="3" cy="-2" r="1.5" fill="#333"/>
      <path d="M-4,3 Q0,7 4,3" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- 表情：一般 -->
