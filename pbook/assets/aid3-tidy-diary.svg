      <circle cx="-5" cy="-12" r="3" fill="#FF7F50" opacity="0.5"/>
      <circle cx="0" cy="-14" r="2.5" fill="#FF7F50" opacity="0.5"/>
      <circle cx="5" cy="-12" r="3" fill="#FF7F50" opacity="0.5"/>
      <circle cx="9" cy="-9" r="2.5" fill="#FF7F50" opacity="0.5"/>
    </g>
    <!-- 表情：开心 -->
