<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text { font-family: 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif; }
    </style>
    <!-- 暖橙渐变 -->
    <linearGradient id="orangeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7F50;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFB347;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF7F50;stop-opacity:1"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1"/>
    </linearGradient>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9F0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFF0E0;stop-opacity:1"/>
    </linearGradient>
    <!-- 魔法光芒 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <!-- 脚印 -->
    <g id="footprint2">
      <ellipse cx="0" cy="0" rx="5" ry="7.5" fill="#FFD700" opacity="0.6"/>
      <circle cx="-4" cy="-10" r="2.5" fill="#FFD700" opacity="0.6"/>
      <circle cx="0" cy="-12" r="2" fill="#FFD700" opacity="0.6"/>
      <circle cx="4" cy="-10" r="2.5" fill="#FFD700" opacity="0.6"/>
      <circle cx="8" cy="-7.5" r="2" fill="#FFD700" opacity="0.6"/>
    </g>
    <!-- 星星 -->
    <g id="star">
      <polygon points="0,-12 3,-4 12,-4 5,2 7,10 0,5 -7,10 -5,2 -12,-4 -3,-4" fill="#FFD700"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="595" height="842" fill="url(#bgGrad2)" rx="12"/>

  <!-- 剪切线边框 -->
  <rect x="12" y="12" width="571" height="818" fill="none" stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="8,4" rx="8"/>

  <!-- ===== 上半部分：整理魔法师证书 ===== -->
  <g transform="translate(30, 25)">
    <!-- 证书外框 -->
    <rect x="0" y="0" width="535" height="390" fill="url(#orangeGrad2)" rx="18" ry="18"/>
    <!-- 内框装饰线 -->
    <rect x="12" y="12" width="511" height="366" fill="none" stroke="#FFF" stroke-width="2" rx="14" stroke-dasharray="6,3" opacity="0.5"/>

    <!-- 四角星星 -->
    <use href="#star" x="30" y="30" transform="scale(0.6)"/>
    <use href="#star" x="505" y="30" transform="scale(0.6)"/>
    <use href="#star" x="30" y="360" transform="scale(0.6)"/>
    <use href="#star" x="505" y="360" transform="scale(0.6)"/>
    <!-- 额外装饰星星 -->
    <use href="#star" x="80" y="55" transform="scale(0.4)"/>
    <use href="#star" x="455" y="55" transform="scale(0.4)"/>
    <use href="#star" x="100" y="340" transform="scale(0.35)"/>
    <use href="#star" x="435" y="340" transform="scale(0.35)"/>

    <!-- 魔法光芒（中心发光） -->
    <circle cx="267" cy="120" r="100" fill="url(#glowGrad)"/>

    <!-- 标题 -->
    <text x="267" y="55" text-anchor="middle" font-size="13" fill="#FFF" opacity="0.7" font-weight="500">~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~</text>
    <text x="267" y="100" text-anchor="middle" font-size="36" font-weight="700" fill="#FFF" stroke="#FFD700" stroke-width="1.5" paint-order="stroke">整理魔法师证书</text>
    <text x="267" y="120" text-anchor="middle" font-size="13" fill="#FFF" opacity="0.7" font-weight="500">~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~</text>

    <!-- 魔法棒图标 -->
    <g transform="translate(267, 148)">
      <line x1="0" y1="0" x2="-15" y2="20" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="2" cy="-2" r="5" fill="none" stroke="#FFD700" stroke-width="1.5"/>
      <circle cx="2" cy="-2" r="2" fill="#FFF" opacity="0.8"/>
      <!-- 小星星 -->
      <polygon points="10,-8 12,-4 16,-4 13,-1 14,3 10,1 6,3 7,-1 4,-4 8,-4" fill="#FFF" opacity="0.7" transform="scale(0.5)"/>
      <polygon points="-12,-12 -10,-8 -6,-8 -9,-5 -8,-1 -12,-3 -16,-1 -15,-5 -18,-8 -14,-8" fill="#FFF" opacity="0.5" transform="scale(0.4)"/>
    </g>

    <!-- 魔法师姓名 -->
    <text x="267" y="195" text-anchor="middle" font-size="16" fill="#FFF" font-weight="500">魔法师姓名：___________________</text>

    <!-- 成功物品数 -->
    <text x="267" y="230" text-anchor="middle" font-size="16" fill="#FFF" font-weight="500">成功帮 <tspan fill="#FFD700" font-size="24" font-weight="700">___</tspan> 件物品找到了家</text>

    <!-- 颁发日期 -->
    <text x="267" y="265" text-anchor="middle" font-size="16" fill="#FFF" font-weight="500">颁发日期：___ 年 ___ 月 ___ 日</text>

    <!-- 认证文字 -->
    <text x="267" y="305" text-anchor="middle" font-size="11" fill="#FFF" opacity="0.8">小步绘本认证</text>
    <!-- 脚印Logo -->
    <g transform="translate(230, 320) scale(0.5)">
      <use href="#footprint2" x="0" y="0"/>
    </g>
    <g transform="translate(270, 318) scale(0.45)">
      <use href="#footprint2" x="0" y="0"/>
    </g>
    <g transform="translate(310, 320) scale(0.5)">
      <use href="#footprint2" x="0" y="0"/>
    </g>
    <text x="267" y="345" text-anchor="middle" font-size="10" fill="#FFF" opacity="0.7">每个会整理的孩子都是魔法师</text>

    <!-- 右下角盖章区 -->
    <g transform="translate(450, 290)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,2" opacity="0.7"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
      <text x="0" y="-5" text-anchor="middle" font-size="8" fill="#FFD700" font-weight="700" opacity="0.8">魔法师</text>
      <text x="0" y="8" text-anchor="middle" font-size="8" fill="#FFD700" font-weight="700" opacity="0.8">认证章</text>
      <text x="0" y="20" text-anchor="middle" font-size="6" fill="#FFD700" opacity="0.6">在此盖章</text>
    </g>
  </g>

  <!-- ===== 中间剪切线 ===== -->
  <g transform="translate(0, 425)">
    <line x1="30" y1="0" x2="565" y2="0" stroke="#6B8E23" stroke-width="2" stroke-dasharray="12,6"/>
    <!-- 剪刀图标 -->
    <g transform="translate(297, 0)">
      <polygon points="-12,-6 -6,-2 -12,2" fill="#6B8E23"/>
      <polygon points="12,-6 6,-2 12,2" fill="#6B8E23"/>
    </g>
    <rect x="210" y="5" width="175" height="18" fill="#FFF9F0" rx="9"/>
    <text x="297" y="17" text-anchor="middle" font-size="10" fill="#6B8E23" font-weight="500">沿此线剪开</text>
  </g>

  <!-- ===== 下半部分：魔法任务卡 ===== -->
  <g transform="translate(30, 455)">
    <!-- 区域标题 -->
    <text x="267" y="0" text-anchor="middle" font-size="16" font-weight="700" fill="#FF7F50">魔法任务卡</text>
    <text x="267" y="18" text-anchor="middle" font-size="10" fill="#A0937D">完成任务，成为整理魔法师！把完成的卡片剪下来吧~</text>

    <!-- 任务卡① -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="248" height="82" fill="#FFFDF8" stroke="#FF7F50" stroke-width="2" stroke-dasharray="6,3" rx="14"/>
      <!-- 左侧序号圆 -->
      <circle cx="30" cy="41" r="20" fill="#FF7F50" opacity="0.15"/>
      <text x="30" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7F50">1</text>
      <!-- 玩具车图标 -->
      <g transform="translate(60, 15)">
        <rect x="0" y="8" width="30" height="12" fill="#FF4444" rx="4"/>
        <rect x="5" y="3" width="18" height="8" fill="#FF6666" rx="3"/>
        <rect x="7" y="4" width="5" height="5" fill="#87CEEB" rx="1"/>
        <rect x="15" y="4" width="5" height="5" fill="#87CEEB" rx="1"/>
        <circle cx="8" cy="22" r="4" fill="#333"/>
        <circle cx="22" cy="22" r="4" fill="#333"/>
      </g>
      <!-- 任务文字 -->
      <text x="105" y="25" font-size="13" font-weight="700" fill="#FF7F50">把3件玩具送回家</text>
      <text x="105" y="42" font-size="10" fill="#A0937D">找到玩具，放回玩具箱</text>
      <!-- 完成打勾 -->
      <text x="200" y="55" text-anchor="middle" font-size="22" fill="#CCC">☐</text>
      <text x="200" y="72" text-anchor="middle" font-size="8" fill="#BBB">完成打勾</text>
    </g>

    <!-- 任务卡② -->
    <g transform="translate(274, 32)">
      <rect x="0" y="0" width="248" height="82" fill="#FFFDF8" stroke="#FF7F50" stroke-width="2" stroke-dasharray="6,3" rx="14"/>
      <!-- 左侧序号圆 -->
      <circle cx="30" cy="41" r="20" fill="#FF7F50" opacity="0.15"/>
      <text x="30" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7F50">2</text>
      <!-- 书本图标 -->
      <g transform="translate(60, 12)">
        <rect x="0" y="0" width="24" height="30" fill="#4A90D9" rx="2"/>
        <rect x="2" y="2" width="20" height="26" fill="#5BA0E9" rx="1"/>
        <line x1="12" y1="0" x2="12" y2="30" stroke="#4A90D9" stroke-width="1"/>
        <polygon points="12,8 14,12 18,12 15,15 16,19 12,16 8,19 9,15 6,12 10,12" fill="#FFD700" transform="scale(0.6) translate(6, 5)"/>
      </g>
      <!-- 任务文字 -->
      <text x="105" y="25" font-size="13" font-weight="700" fill="#FF7F50">把2本绘本放回书架</text>
      <text x="105" y="42" font-size="10" fill="#A0937D">找到绘本，放回书架</text>
      <!-- 完成打勾 -->
      <text x="200" y="55" text-anchor="middle" font-size="22" fill="#CCC">☐</text>
      <text x="200" y="72" text-anchor="middle" font-size="8" fill="#BBB">完成打勾</text>
    </g>

    <!-- 任务卡③ -->
    <g transform="translate(12, 128)">
      <rect x="0" y="0" width="248" height="82" fill="#FFFDF8" stroke="#FF7F50" stroke-width="2" stroke-dasharray="6,3" rx="14"/>
      <!-- 左侧序号圆 -->
      <circle cx="30" cy="41" r="20" fill="#FF7F50" opacity="0.15"/>
      <text x="30" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7F50">3</text>
      <!-- 衣服图标 -->
      <g transform="translate(60, 8)">
        <path d="M12,0 L6,4 L0,4 L4,20 L2,32 L22,32 L20,20 L24,4 L18,4 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="1" rx="2"/>
        <path d="M8,4 L12,10 L16,4" fill="none" stroke="#FF69B4" stroke-width="1.2"/>
        <!-- 衣架 -->
        <line x1="12" y1="-4" x2="12" y2="2" stroke="#999" stroke-width="1"/>
        <path d="M6,-4 Q12,-8 18,-4" fill="none" stroke="#999" stroke-width="1"/>
      </g>
      <!-- 任务文字 -->
      <text x="105" y="25" font-size="13" font-weight="700" fill="#FF7F50">把衣服挂到衣柜</text>
      <text x="105" y="42" font-size="10" fill="#A0937D">找到衣服，挂进衣柜</text>
      <!-- 完成打勾 -->
      <text x="200" y="55" text-anchor="middle" font-size="22" fill="#CCC">☐</text>
      <text x="200" y="72" text-anchor="middle" font-size="8" fill="#BBB">完成打勾</text>
    </g>

    <!-- 任务卡④ -->
    <g transform="translate(274, 128)">
      <rect x="0" y="0" width="248" height="82" fill="#FFFDF8" stroke="#FF7F50" stroke-width="2" stroke-dasharray="6,3" rx="14"/>
      <!-- 左侧序号圆 -->
      <circle cx="30" cy="41" r="20" fill="#FF7F50" opacity="0.15"/>
      <text x="30" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7F50">4</text>
      <!-- 桌面图标 -->
      <g transform="translate(60, 10)">
        <!-- 桌面 -->
        <rect x="0" y="0" width="28" height="6" fill="#DEB887" stroke="#C49A6C" stroke-width="1" rx="2"/>
        <!-- 桌腿 -->
        <line x1="4" y1="6" x2="2" y2="28" stroke="#C49A6C" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="6" x2="26" y2="28" stroke="#C49A6C" stroke-width="2" stroke-linecap="round"/>
        <!-- 桌上物品 -->
        <rect x="4" y="-6" width="6" height="6" fill="#FF6B6B" rx="1"/>
        <rect x="14" y="-8" width="8" height="8" fill="#4ECDC4" rx="1"/>
        <circle cx="24" cy="-4" r="4" fill="#FFD93D"/>
      </g>
      <!-- 任务文字 -->
      <text x="105" y="25" font-size="13" font-weight="700" fill="#FF7F50">把桌面上的东西</text>
      <text x="105" y="42" font-size="13" font-weight="700" fill="#FF7F50">分类放好</text>
      <!-- 完成打勾 -->
      <text x="200" y="55" text-anchor="middle" font-size="22" fill="#CCC">☐</text>
      <text x="200" y="72" text-anchor="middle" font-size="8" fill="#BBB">完成打勾</text>
    </g>

    <!-- 底部提示 -->
    <text x="267" y="232" text-anchor="middle" font-size="11" fill="#6B8E23" font-weight="500">全部完成？恭喜你成为真正的整理魔法师！</text>
    <text x="267" y="248" text-anchor="middle" font-size="10" fill="#A0937D">记得剪下证书部分保存哦~</text>
  </g>

  <!-- ===== 底部打印建议 ===== -->
  <g transform="translate(297, 870)">
    <text x="0" y="0" text-anchor="middle" font-size="8" fill="#BBB">打印建议：建议使用A4纸张打印，彩色效果更佳 | 虚线处可剪切 | 适合3-6岁儿童</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#BBB">绘本《玩具的家在哪里？》配套教具 · 小步绘本</text>
  </g>

  <!-- 装饰脚印 -->
  <use href="#footprint2" x="50" y="825" transform="scale(0.5) rotate(-15)"/>
  <use href="#footprint2" x="545" y="830" transform="scale(0.5) rotate(10)"/>
</svg>