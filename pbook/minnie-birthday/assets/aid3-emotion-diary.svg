    <line x1="62" y1="70" x2="240" y2="70" stroke="#CCC" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="248" y="72" font-size="10.5" fill="#666" font-weight="500">因为</text>
    <line x1="282" y1="70" x2="495" y2="70" stroke="#CCC" stroke-width="0.8" stroke-dasharray="3,2"/>
    <!-- 第3行 -->
