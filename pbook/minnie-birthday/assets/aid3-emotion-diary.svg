  <!-- ===== 每日感恩三件事 ===== -->
  <g transform="translate(40, 515)">
    <rect x="0" y="0" width="515" height="100" fill="#FF7F50" opacity="0.06" stroke="#FF7F50" stroke-width="1.5" rx="12"/>
    <!-- 标题 + 爱心 -->
