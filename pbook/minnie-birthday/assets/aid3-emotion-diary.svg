    <text x="0" y="12" text-anchor="middle" font-size="30" font-weight="700" fill="#FF7F50">我的情绪日记</text>
    <line x1="-140" y1="24" x2="140" y2="24" stroke="#6B8E23" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="297" y="78" text-anchor="middle" font-size="11" fill="#A0937D">每天给情绪记一笔，看看心里的天气怎么变化！</text>

