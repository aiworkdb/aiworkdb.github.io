      <circle cx="280" cy="20" r="7" fill="none" stroke="#86C166" stroke-width="1.5"/><circle cx="310" cy="20" r="7" fill="none" stroke="#F2C94C" stroke-width="1.5"/><circle cx="340" cy="20" r="7" fill="none" stroke="#F2994A" stroke-width="1.5"/><circle cx="370" cy="20" r="7" fill="none" stroke="#EB5757" stroke-width="1.5"/>
