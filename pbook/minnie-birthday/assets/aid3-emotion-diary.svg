<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text { font-family: 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9F0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFF0E0;stop-opacity:1"/>
    </linearGradient>
    <!-- 暖橙渐变 -->
    <linearGradient id="orangeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF7F50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1"/>
    </linearGradient>
    <!-- 脚印 -->
    <g id="footprint3">
      <ellipse cx="0" cy="0" rx="6" ry="9" fill="#FF7F50" opacity="0.5"/>
      <circle cx="-5" cy="-12" r="3" fill="#FF7F50" opacity="0.5"/>
      <circle cx="0" cy="-14" r="2.5" fill="#FF7F50" opacity="0.5"/>
      <circle cx="5" cy="-12" r="3" fill="#FF7F50" opacity="0.5"/>
      <circle cx="9" cy="-9" r="2.5" fill="#FF7F50" opacity="0.5"/>
    </g>
    <!-- 天气：晴天（开心） -->
    <g id="w-sunny">
      <circle cx="0" cy="0" r="8" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
      <g stroke="#FFA500" stroke-width="1.4" stroke-linecap="round">
        <line x1="0" y1="-11" x2="0" y2="-14"/>
        <line x1="0" y1="11" x2="0" y2="14"/>
        <line x1="-11" y1="0" x2="-14" y2="0"/>
        <line x1="11" y1="0" x2="14" y2="0"/>
        <line x1="-8" y1="-8" x2="-10" y2="-10"/>
        <line x1="8" y1="-8" x2="10" y2="-10"/>
        <line x1="-8" y1="8" x2="-10" y2="10"/>
        <line x1="8" y1="8" x2="10" y2="10"/>
      </g>
    </g>
    <!-- 天气：多云（一般） -->
    <g id="w-cloudy">
      <path d="M-12,4 Q-12,-3 -5,-3 Q-3,-9 4,-7 Q11,-9 13,-2 Q16,-2 16,3 Q16,7 12,7 L-8,7 Q-12,7 -12,4 Z" fill="#C8D6E5" stroke="#7B9CC4" stroke-width="1.2"/>
    </g>
    <!-- 天气：雨天（难过） -->
    <g id="w-rainy">
      <path d="M-12,0 Q-12,-7 -5,-7 Q-3,-12 4,-11 Q11,-12 13,-5 Q16,-5 16,0 Q16,3 12,3 L-8,3 Q-12,3 -12,0 Z" fill="#9BB5D6" stroke="#5A7A9C" stroke-width="1.2"/>
      <line x1="-6" y1="6" x2="-8" y2="11" stroke="#5A7A9C" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1" y1="6" x2="-1" y2="11" stroke="#5A7A9C" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="6" x2="6" y2="11" stroke="#5A7A9C" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 天气：雷电（生气） -->
    <g id="w-thunder">
      <path d="M-12,0 Q-12,-7 -5,-7 Q-3,-12 4,-11 Q11,-12 13,-5 Q16,-5 16,0 Q16,3 12,3 L-8,3 Q-12,3 -12,0 Z" fill="#7B8CA0" stroke="#4A5A6E" stroke-width="1.2"/>
      <polygon points="2,4 -3,10 1,10 -2,15 5,8 1,8 4,4" fill="#FFD700" stroke="#FFA500" stroke-width="0.8"/>
    </g>
    <!-- 生日帽 -->
