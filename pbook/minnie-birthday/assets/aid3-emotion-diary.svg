    <text x="48" y="25" font-size="14" font-weight="700" fill="#FF7F50">今日感恩三件事</text>
    <text x="495" y="25" text-anchor="end" font-size="9" fill="#A0937D">每天找三件值得感谢的小事吧！</text>
    <!-- 第1行 -->
    <text x="20" y="52" font-size="10.5" fill="#666" font-weight="500">1. 感谢</text>
    <line x1="62" y1="50" x2="240" y2="50" stroke="#CCC" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="248" y="52" font-size="10.5" fill="#666" font-weight="500">因为</text>
    <line x1="282" y1="50" x2="495" y2="50" stroke="#CCC" stroke-width="0.8" stroke-dasharray="3,2"/>
    <!-- 第2行 -->
